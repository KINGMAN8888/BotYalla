<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070D">
<meta http-equiv="refresh" content="20">
<title>لا يوجد اتصال · BotYalla</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05070D;color:#E8ECF7;font-family:'Cairo','Segoe UI',Tahoma,sans-serif}
  body{display:flex;align-items:center;justify-content:center;padding:24px;
    padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));
    background:radial-gradient(600px 400px at 50% 20%,rgba(124,108,246,.22),transparent 70%),
               radial-gradient(500px 360px at 50% 90%,rgba(34,211,238,.12),transparent 70%),#05070D}
  .card{width:100%;max-width:400px;text-align:center}
  .ic{position:relative;width:112px;height:112px;margin:0 auto 26px}
  .ic img{width:112px;height:112px;border-radius:28px;box-shadow:0 18px 50px rgba(124,108,246,.35)}
  .ic i{position:absolute;inset:-10px;border-radius:36px;border:2px solid rgba(143,233,255,.35);animation:p 2.2s ease-out infinite}
  @keyframes p{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
  @media (prefers-reduced-motion:reduce){.ic i{animation:none}}
  h1{margin:0 0 10px;font-size:24px;font-weight:800}
  p{margin:0 0 6px;color:#9AA6C4;font-size:14.5px;line-height:1.8}
  .en{direction:ltr;font-family:'Inter','Segoe UI',sans-serif;margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)}
  .en h2{margin:0 0 6px;font-size:16px;font-weight:700;color:#C9D2EA}
  a.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;min-height:48px;padding:0 26px;
    border-radius:14px;font-weight:800;font-size:15px;color:#0B1020;text-decoration:none;
    background:linear-gradient(100deg,#8FE9FF,#B3A6FF);box-shadow:0 10px 30px rgba(143,233,255,.25)}
</style>
</head>
<body>
  <main class="card">
    <div class="ic"><i></i><img src="/static/brand/icon-192.png" alt="BotYalla"></div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تأكّد من الواي فاي أو بيانات الجوال — سنعيد المحاولة تلقائياً.</p>
    <p>رسائل عملائك محفوظة، وستصلك تنبيهاتها فور عودة الاتصال.</p>
    <a class="btn" href="">إعادة المحاولة ↻</a>
    <div class="en">
      <h2>You're offline</h2>
      <p>Check your Wi-Fi or mobile data — we'll retry automatically.</p>
    </div>
  </main>
</body>
</html>
