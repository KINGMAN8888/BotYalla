# ============================================================================
#  BotYalla — إعداد Nginx للإنتاج
#  ضعه في /etc/nginx/sites-available/botyalla ثم فعّله.
#  سكربت النشر يستبدل __SERVER_NAME__ تلقائياً بالدومين أو بعنوان السيرفر.
#
#  تفعيل HTTPS (ضروري جداً بعد ربط الدومين):
#  1. تأكد أن الدومين يشير إلى الـ IP الخاص بالسيرفر.
#  2. ثبّت certbot:  apt update && apt install -y python3-certbot-nginx
#  3. شغّل الأمر:    certbot --nginx -d yourdomain.com
#     سيقوم certbot بتعديل هذا الملف تلقائياً لإضافة شهادات SSL وإعداد تحويل
#     HTTP إلى HTTPS.
# ============================================================================

# حدّ معدّل على تسجيل الدخول — طبقة أولى قبل محدِّد التطبيق نفسه
limit_req_zone $binary_remote_addr zone=botyalla_login:10m rate=20r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    # رفع الإيصالات ووسائط المكتبة (فيديو حتى 16MB). التطبيق يحدّ الطلب بـ 18MB
    # وكل نوع بحدّه الأضيق — هذا حاجز خارجي بهامش فوقه.
    client_max_body_size 20M;
    client_body_timeout 30s;

    # لا تُفصح عن إصدار nginx
    server_tokens off;

    # ---- ترويسات أمنية ----
    # ملاحظة: Content-Security-Policy تصدر من التطبيق نفسه لا من هنا، لأن
    # الـ nonce يتغيّر مع كل طلب و Flask هو من يرسم القوالب. لا تضِفها هنا:
    # `add_header` لا يستبدل ترويسة أرسلها التطبيق بل يضيف ثانية، والمتصفح
    # عندئذ يطبّق **تقاطع** السياستين فتنكسر الصفحة.
    #
    # ولنفس السبب حُذفت من هنا `X-Content-Type-Options` و`Referrer-Policy`:
    # التطبيق يرسلهما (`_security_headers`) فكانتا تُرسَلان **مرتين** في كل
    # استجابة. المتصفحات تقبل التكرار المتطابق، لكن مصدرين لحقيقة واحدة يعني
    # أن تعديل أحدهما لاحقاً يترك الآخر متناقضاً معه بصمت. المصدر الآن واحد:
    # التطبيق. ويبقى هنا ما لا يرسله التطبيق فقط.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS: يرسلها التطبيق تلقائياً على الطلبات المؤمّنة (يقرأ X-Forwarded-Proto).
    # لتفعيلها من nginx أيضاً بعد التأكد من عمل HTTPS، ضعها داخل قسم 443 وحده
    # — لا هنا — حتى لا تُرسل على http فتحجب الموقع قبل جهوزية الشهادة.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- الضغط: حزمة React ‏326KB → ~104KB ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # ---- الملفات الثابتة يقدّمها nginx مباشرة، لا Flask ----
    # حزم React: كل ملفات JS تحمل hash في اسمها (vite.config.js ← manifest ← dist_entry)،
    # وstyle.css يُطلب دائماً بـ ?v=<تاريخ التعديل> (static_v) — أي تغيير = رابط جديد، فالتخزين
    # سنة كاملة آمن ولا يعلق أحد على نسخة قديمة. كانت must-revalidate: 600KB تُراجَع مع كل صفحة.
    location /static/dist/ {
        alias /opt/botyalla/static/dist/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /static/ {
        alias /opt/botyalla/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # الفحص الصحّي بلا ضجيج في السجلات
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    location = /login {
        limit_req zone=botyalla_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # امنع الوصول لأي ملف حسّاس لو وُضع بالخطأ تحت الجذر
    location ~ /\.(env|git) { deny all; return 404; }
}

# ============================================================================
#  بعد ربط الدومين:  certbot --nginx -d example.com -d www.example.com
#  ثم فعّل سطر HSTS أعلاه، واضبط COOKIE_SECURE=1 في .env وأعد تشغيل الخدمة.
# ============================================================================
