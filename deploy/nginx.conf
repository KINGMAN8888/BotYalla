# ضعه في /etc/nginx/sites-available/botyalla ثم فعّله
server {
    listen 80;
    server_name botyalla.com www.botyalla.com;   # غيّر للدومين بتاعك

    client_max_body_size 12M;   # للسماح برفع صور إثبات الدفع

    location /static/ {
        alias /opt/botyalla/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# بعد الرفع: شغّل  sudo certbot --nginx -d botyalla.com -d www.botyalla.com  لتفعيل HTTPS مجاناً
