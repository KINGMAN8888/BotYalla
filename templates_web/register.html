{% extends "base.html" %}{% block title %}{{ t('register') }} · {{ brand }}{% endblock %}
{% block body %}
<div class="authwrap">
  <div class="logo"><img src="{{ url_for('static', filename='logo.svg') }}" alt="BotYalla"></div>
  <div class="card">
    <h1 class="center">{{ t('register') }}</h1>
    <p class="sub center">{{ t('register_sub') }}</p>
    <form method="post">
    {{ csrf_field() }}
      <label>{{ t('username') }}</label><input name="username" required autofocus>
      <label>{{ t('password') }}</label><input type="password" name="password" required>
      <div class="hint">{{ t('pw_hint') }}</div>
      <div style="margin-top:18px;"><button class="btn block">{{ icon('sparkles',16) }} {{ t('register') }}</button></div>
    </form>
    <p class="center muted" style="margin-top:16px;font-size:13px;">
      {{ t('have_account') }} <a href="{{ url_for('login') }}">{{ t('signin_link') }}</a></p>
  </div>
</div>
{% endblock %}
