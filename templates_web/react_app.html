<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }} · {{ brand }}</title>
<meta name="theme-color" content="#05070D">
<meta name="csrf-token" content="{{ csrf_token }}">
<link rel="icon" type="image/svg+xml" href="{{ static_v('mark.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ static_v('dist/style.css') }}">
{% if needs_chart %}<script nonce="{{ csp_nonce }}" src="{{ static_v('chart.min.js') }}"></script>{% endif %}
<script nonce="{{ csp_nonce }}">document.documentElement.className += " js";</script>
<script nonce="{{ csp_nonce }}">window.BY = {{ by_json|safe }};</script>
<style nonce="{{ csp_nonce }}">
  html{background:#05070D;}
  body{font-family:{% if lang=='en' %}'Inter',{% endif %}'Cairo','Segoe UI',Tahoma,sans-serif;}
  /* شاشة تحميل بسيطة تختفي فور تركيب React — لا وميض أبيض ولا قفزة */
  #boot{min-height:100vh;display:grid;place-items:center;color:#7B87A8;font-size:14px;gap:14px;}
  #boot i{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.14);
    border-top-color:#22D3EE;animation:sp .7s linear infinite;display:block;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .react-on #boot{display:none;}
</style>
</head>
<body>
<div id="root" data-view="{{ view }}">
  <div id="boot"><i></i><span>{{ page_title }}</span></div>
</div>
<noscript>
  <div style="padding:32px;color:#AEB9D4;font-size:15px;line-height:1.8;">
    {{ 'هذه الصفحة تحتاج تفعيل الجافاسكربت.' if lang=='ar' else 'This page requires JavaScript to be enabled.' }}
  </div>
</noscript>
<script nonce="{{ csp_nonce }}" type="module" src="{{ static_v('dist/console.js') }}"></script>
</body>
</html>
